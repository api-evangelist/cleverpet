notes: >-
  CleverPet's only first-party client library is hackerpet, an open-source
  Particle/Arduino C++ library for programming the CleverPet Hub (an embedded
  IoT device on the Particle platform). It is distributed through the Particle
  library manager rather than a general-purpose package registry (npm/PyPI/etc.),
  and exposes the HubInterface class API documented at
  https://cleverpet.github.io/hackerpet-api-docs/. No web/REST client SDKs exist
  because the Hub has no public web API.
