aid: cleverpet
name: CleverPet
description: >-
  CleverPet is a pet-technology company behind the CleverPet Hub, a programmable
  "game console for pets" that gives dogs and cats mental stimulation through
  puzzle games and dispenses food treats as rewards. The Hub is built on the
  Particle IoT platform, and CleverPet publishes hackerpet, an open-source
  Particle/Arduino C++ library that lets developers write, customize, and share
  their own games by controlling the Hub's lights, food pod, and tray motor
  through the HubInterface class. The company was part of the Techstars
  accelerator, and its team and open-source hardware/software work continued
  under the FluentPet brand.
